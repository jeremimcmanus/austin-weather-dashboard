services:
  - type: web
    name: austin-weather-dashboard
    runtime: docker
    plan: starter
    region: oregon
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    disk:
      name: weather-history
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "10000"
      - key: DATA_DIR
        value: /var/data
      - key: COLLECTION_INTERVAL_SECONDS
        value: "900"
